{% extends "base.html" %}

{% load static %}

{% block extra_css %}
<style>
    html,
    body {
        background-color: #000000 !important;
    }

    .overlay {
        background: #000000;
    }

    body {
        background: url('{% static "images/homepage_background_cropped.jpeg" %}') no-repeat center 44px;
        background-size: cover;
        background-attachment: scroll;
    }

    @media (max-width: 991px) {
        body {
            background-size: clamp(420px, 95vw, 1100px) auto;
            background-position: center 140px;
        }
    }

    @media (max-width: 575px) {
        body {
            background-size: clamp(360px, 110vw, 820px) auto;
            background-position: center 130px;
        }
    }

    @media (max-width: 991px) {
        .home-hero-copy {
            margin-top: 180px !important;
        }
    }

    @media (max-width: 575px) {
        .home-hero-copy {
            margin-top: 120px !important;
        }
    }
</style>
{% endblock %}

{% block page_header %}
    <div class="container header-container">
        <div class="row">
            <div class="col"></div>
        </div>
    </div>
{% endblock %}

{% block content %}
    <div class="container h-100">
        <div class="row h-100">
            <div class="col-7 col-md-6 home-hero-copy" style="margin-top: 500px;">
                <h1 class="display-4 logo-font">
                    Calling ALL Trekkies! <br>
                    Boldly Shop the Final Frontier 🖖
                </h1>
                <div class="my-5">
                    <h4>
                        <a href="{% url 'products' %}" class="shop-now-button btn btn-lg rounded-0 text-uppercase py-3">Shop Now</a>
                    </h4>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
