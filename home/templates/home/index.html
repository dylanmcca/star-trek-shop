{% extends "base.html" %}

{% load static %}

{% block extra_css %}
<style>
    body {
        background: url('/media/homepage_background_cropped.jpeg') no-repeat center 44px;
        background-size: cover;
        background-attachment: scroll;
    }
</style>
{% endblock %}

{% block page_header %}
    <div class="container header-container">
        <div class="row">
            <div class="col"></div>
        </div>
    </div>
{% endblock %}

            <div class="col-7 col-md-6" style="margin-top: 500px;">
                <h1 class="display-4 logo-font">
                    Calling ALL Trekkies! <br>
                    Boldly Shop the Final Frontier 🖖
                </h1>
                <div class="my-5">
                    <h4>
                        <a href="{% url 'products' %}" class="shop-now-button btn btn-lg rounded-0 text-uppercase py-3">Shop Now</a>
                    </h4>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
