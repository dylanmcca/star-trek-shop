{% extends "base.html" %}
{% load static %}

{% block content %}


<div class="default-page-container" id="faq-container">
    <div id="faq-content">
        <h1 id="faq-heading">FAQ</h1>
        <ul class="faq-ul">
        <!-- Populates the FAQ list -->
        {% for faq in faqs %}
            <li class="faq-li">
                <h2 class="faq-h2">{{ faq.question }}</h2>
                <p class="faq-text">{{ faq.answer }}</p>
            </li>
        {% empty %}
            <li class="faq-li">
                <h2 class="faq-h2">No FAQs yet</h2>
                <p class="faq-text">FAQ entries will appear here once they are added.</p>
            </li>
        {% endfor %}
        </ul>
    </div>
</div>

{% endblock %}
