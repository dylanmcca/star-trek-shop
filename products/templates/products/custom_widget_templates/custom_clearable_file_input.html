{% if widget.is_initial %}
    <p class="text-black mb-2">{{ widget.initial_text }}:</p>
    <a href="{{ widget.value.url }}">
        <img width="96" height="96" class="rounded shadow-sm border-yellow" src="{{ widget.value.url }}" alt="Current product image preview">
    </a>
    {% if not widget.required %}
        <div class="custom-control custom-checkbox mt-2">
            <input class="custom-control-input" type="checkbox" name="{{ widget.checkbox_name }}" id="{{ widget.checkbox_id }}">
            <label class="custom-control-label text-danger" for="{{ widget.checkbox_id }}">{{ widget.clear_checkbox_label }}</label>
        </div>
    {% endif %}<br>
    <span class="text-black">{{ widget.input_text }}</span>
{% endif %}
<button type="button" class="auth-style-button product-action-button select-image-button" style="display:inline-flex;align-items:center;justify-content:center;min-height:44px;height:44px;padding:.75rem 1.5rem;line-height:1;box-sizing:border-box;white-space:nowrap;font-size:1rem;margin-top:.5rem;" onclick="document.getElementById('new-image').click();">Select Image</button>
<input class="select-image-input" id="new-image" type="{{ widget.type }}" name="{{ widget.name }}"{% include "django/forms/widgets/attrs.html" %}>
<p class="text-black font-weight-bold mt-2 mb-0" id="filename"></p>
